<!DOCTYPE html>
<html>

<head>
    <title>CPIT-405 Lab 3</title>

    <style>
        .image-preview {
            width: 200px;
        }

        .image-preview img {
            width: 100%;
            border-top: 30px solid skyblue;
            border-right: 30px solid lightpink;
            border-bottom: 30px solid lightgreen;
            border-left: 30px solid #ffefd5;
        }
    
        p>span {
            color: red;
        }

        #header span {
            color: pink;
        }

        span {
            color: green;
        }

        #header *:last-child {
            color: orange;
        }

        #header span:first-child:hover {
            color: blue;
        }
    
        h1 {
            color:rgb(29, 29, 150)
        }
        h2 {
            color:rgb(43, 91, 147);
        }
    </style>
</head>

<body>
    <h1>Lab 3: CSS</h1>

    <h2>Question 1</h2>
    <div class="image-preview">
        <img src='https://cpit405.gitlab.io/images/KAU_logo.png'>
    </div>


    <h2>Question 2</h2>
    <div id="header">
        <span class="myclass1">Every</span>
        <span class="myclass2">one can</span>
        <span class="myclass3">success.</span>
    </div>
    <p> One machine can do the work of fifty ordinary men.
        <span class="myclass4">No machine can do the work of one extraordinary man.</span>
    </p>

    <table border="1">
        <tr>
            <th></th>
            <th>color</th>
            <th>color when mouse over</th>
        </tr>
        <tr>
            <th>span.myclass1</th>
            <td>pink</td>
            <td>blue</td>
        </tr>
        <tr>
            <th>span.myclass2</th>
            <td>pink</td>
            <td>pink</td>
        </tr>
        <tr>
            <th>span.myclass3</th>
            <td>orange</td>
            <td>orange</td>
        </tr>
        <tr>
            <th>span.myclass4</th>
            <td>red</td>
            <td>red</td>
        </tr>

    </table>
</body>
</html>
